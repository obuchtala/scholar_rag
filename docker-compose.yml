services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  app:
    image: ghcr.io/obuchtala/scholar_rag:latest
    # To build locally instead: comment out 'image' and uncomment 'build'
    # build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ${CACHE_DIR}:${CACHE_DIR}
    depends_on:
      - qdrant
    profiles:
      - app

  ui:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ${CACHE_DIR}:${CACHE_DIR}
    ports:
      - "7860:7860"
    command: ["ui"]
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
